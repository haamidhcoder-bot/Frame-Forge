<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameForge – Layout Designer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='frame.png') }}">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo"><img src="{{ url_for('static', filename='frame.png') }}" alt=""  width="20" height="20"></span> FrameForge</div>
  <input id="projectName" class="pname" value="Untitled design" spellcheck="false" aria-label="Project name">
  <span id="status" class="status">Unsaved</span>
  <div class="spacer"></div>
  <button class="tbtn" data-cmd="undo" title="Undo (Ctrl+Z)">↶</button>
  <button class="tbtn" data-cmd="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  <span class="sep"></span>
  <button class="tbtn txt" data-cmd="new">New</button>
  <button class="tbtn txt" data-cmd="open">Open</button>
  <button class="tbtn txt" data-cmd="import">Import</button>
  <button class="tbtn txt" data-cmd="exportjson">Export JSON</button>
  <span class="sep"></span>
  <button class="tbtn txt" data-cmd="preview">Preview</button>
  <button class="tbtn txt" data-cmd="exporthtml">Export HTML</button>
  <button class="tbtn txt primary" data-cmd="save" title="Save (Ctrl+S)">Save</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</header>

<main class="workspace">
  <aside class="panel left">
    <div class="ptitle">Layers</div>
    <div id="layers" class="layers"></div>
  </aside>

  <section class="stage">
    <div id="viewport" class="viewport">
      <div id="world" class="world"></div>
      <div id="overlay" class="overlay"></div>
    </div>

    <div class="toolbar" id="toolbar">
      <button data-tool="move" title="Move (V)" class="active">➤</button>
      <button data-tool="hand" title="Hand (H)">✋</button>
      <span class="tsep"></span>
      <button data-tool="frame" title="Frame (F)">#</button>
      <button data-tool="rect" title="Rectangle (R)">▭</button>
      <button data-tool="ellipse" title="Ellipse (O)">◯</button>
      <button data-tool="text" title="Text (T)">T</button>
      <button data-tool="button" title="Button (B)">▣</button>
      <button data-tool="image" title="Image (I)">▨</button>
    </div>

    <div class="zoombar">
      <button data-zoom="out" title="Zoom out">−</button>
      <span id="zoomLabel">100%</span>
      <button data-zoom="in" title="Zoom in">+</button>
      <button data-zoom="fit" title="Zoom to fit (Shift+1)">Fit</button>
    </div>
  </section>

  <aside class="panel right">
    <div class="ptitle">Design</div>
    <div id="props" class="props"></div>
    <a class="manual-link" href="{{ url_for('static', filename='user_guide.html') }}" target="_blank" rel="noopener">User Manual</a>
  </aside>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><strong>Open project</strong><button id="modalClose" class="tbtn">✕</button></div>
    <div id="projectList" class="plist"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
